name: Deploy City Drive Prototype
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage garage and vehicle files
        run: |
          test -s index.html
          test -s assets/onyx.glb
          mkdir _site
          cp index.html _site/
          mkdir _site/assets
          cp assets/onyx.glb _site/assets/
          mkdir -p _site/r03-preview
          cp r03-preview/index.html _site/r03-preview/
          test -s _site/r03-preview/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for the Pages artifact to appear in the Actions API
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in {1..10}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.expired == false) | .name' | grep -Fxq "$ARTIFACT"; then
              exit 0
            fi
            sleep 5
          done
          echo "The Pages artifact is not visible in the Actions API."
          exit 1
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Allow time for Pages artifact propagation
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - name: Retry Pages deployment
        if: steps.deployment.outcome == 'failure'
        id: retry
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
