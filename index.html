<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>City Drive Prototype</title><style>

</style></head><body><div class="hud">CITY DRIVE <span id="speed">0</span> km/h<br><small id="fps">FPS: 啟動中…</small></div><div class="error" id="error"></div><div class="hint">拖曳方向盤 · 按住油門行駛</div><div class="controls"><div class="steer" id="steer">↔</div><div class="right"><div class="pedal" id="brake">煞車</div><div class="pedal" id="gas">油門</div></div></div>
<script type="module">
let THREE;
try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js')}catch(e){try{THREE=await import('https://unpkg.com/three@0.160.0/build/three.module.js')}catch(e2){document.getElementById('fps').textContent='FPS: 載入失敗';let box=document.getElementById('error');box.style.display='block';box.textContent='3D 引擎載入失敗。請確認網路連線，重新整理頁面。';throw e2}}
try{
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ec9df);scene.fog=new THREE.Fog(0x9ec9df,70,240);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.domElement.style.position='fixed';renderer.domElement.style.inset='0';renderer.domElement.style.zIndex='1';document.body.appendChild(renderer.domElement);renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('selectstart',e=>e.preventDefault(),{passive:false});document.addEventListener('contextmenu',e=>e.preventDefault(),{passive:false});document.addEventListener('touchstart',e=>{if(e.target.closest('.controls,.hud,.hint'))e.preventDefault()},{passive:false});document.addEventListener('touchend',e=>{if(e.target.closest('.controls,.hud,.hint'))e.preventDefault()},{passive:false});
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;scene.add(new THREE.HemisphereLight(0xeaf6ff,0x536247,2.3));const sun=new THREE.DirectionalLight(0xfff0d8,2.2);sun.position.set(-35,65,45);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=55;sun.shadow.camera.bottom=-55;sun.shadow.bias=-.0005;scene.add(sun);const mat=(c,r=.8)=>new THREE.MeshStandardMaterial({color:c,roughness:r});const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),mat(0x668c62));ground.rotation.x=-Math.PI/2;ground.position.y=-.1;ground.receiveShadow=true;scene.add(ground);const shoulder=new THREE.Mesh(new THREE.PlaneGeometry(24,300),mat(0x50575a));shoulder.rotation.x=-Math.PI/2;shoulder.position.y=0;scene.add(shoulder);const road=new THREE.Mesh(new THREE.PlaneGeometry(18,300),mat(0x292d32,.96));road.rotation.x=-Math.PI/2;road.position.y=.025;road.receiveShadow=true;scene.add(road);for(let x of [-8.3,8.3]){let edge=new THREE.Mesh(new THREE.BoxGeometry(.18,.035,300),mat(0xf2f2e9));edge.position.set(x,.06,0);scene.add(edge)}for(let z=-140;z<150;z+=10){let d=new THREE.Mesh(new THREE.BoxGeometry(.16,.035,4.3),mat(0xf5f2df));d.position.set(0,.06,z);scene.add(d)}for(let x of [-9.5,9.5]){let curb=new THREE.Mesh(new THREE.BoxGeometry(.55,.35,300),mat(0xb9b9b3));curb.position.set(x,.16,0);curb.castShadow=true;scene.add(curb);let sidewalk=new THREE.Mesh(new THREE.BoxGeometry(3,.12,300),mat(0x999b97));sidewalk.position.set(x*1.25,.22,0);scene.add(sidewalk)}for(let z=-135;z<140;z+=24){for(let side of [-1,1]){let pole=new THREE.Mesh(new THREE.CylinderGeometry(.09,.13,6,8),mat(0x353a40));pole.position.set(side*12,3,z);scene.add(pole);let arm=new THREE.Mesh(new THREE.BoxGeometry(1.4,.12,.12),mat(0x353a40));arm.position.set(side*11.4,5.7,z);scene.add(arm);let lamp=new THREE.Mesh(new THREE.BoxGeometry(.5,.18,.35),mat(0xffe4a2,.4));lamp.position.set(side*10.8,5.65,z);scene.add(lamp)}}
for(let i=0;i<65;i++){let side=i%2?1:-1,z=-140+i*4.5,x=side*(14+Math.random()*18),h=8+Math.random()*35,w=7+Math.random()*10;let b=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),mat([0x8899aa,0xc4b8a8,0x7e9992,0x9c8d9d][i%4]));b.position.set(x,h/2,z);b.castShadow=true;b.receiveShadow=true;scene.add(b);for(let yy=3;yy<h-2;yy+=3.5)for(let xx=-w/2+1;xx<w/2-1;xx+=2.5){let win=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.4,.08),mat(0xadd5e8));win.position.set(x+xx,yy,z+side*(w/2+.05));scene.add(win)}}for(let i=0;i<45;i++){let z=-130+i*7.5,side=i%2?1:-1,x=side*(17+Math.random()*5);let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.38,3.4,8),mat(0x76503a));trunk.position.set(x,1.7,z);trunk.castShadow=true;scene.add(trunk);let crown=new THREE.Mesh(new THREE.SphereGeometry(2.5,12,10),mat([0x39794a,0x477f49,0x53864b][i%3]));crown.position.set(x,4.2,z);crown.castShadow=true;scene.add(crown)}
const car=new THREE.Group();const paint=new THREE.MeshPhysicalMaterial({color:0xc91824,metalness:.55,roughness:.28,clearcoat:1,clearcoatRoughness:.12});const dark=mat(0x111820,.3),glassmat=new THREE.MeshPhysicalMaterial({color:0x102936,metalness:.35,roughness:.12,transparent:true,opacity:.92,clearcoat:1}),chrome=mat(0x9da6ad,.25),rubber=mat(0x151619,.92);function curvedBodyShape(){const s=new THREE.Shape();s.moveTo(-1.02,-2.18);s.quadraticCurveTo(-1.18,-1.9,-1.12,-1.45);s.lineTo(-1.18,-.72);s.quadraticCurveTo(-1.32,-.45,-1.25,.05);s.quadraticCurveTo(-1.18,.5,-.92,1.08);s.quadraticCurveTo(-.75,1.55,-.58,2.05);s.quadraticCurveTo(0,2.28,.58,2.05);s.quadraticCurveTo(.75,1.55,.92,1.08);s.quadraticCurveTo(1.18,.5,1.25,.05);s.quadraticCurveTo(1.32,-.45,1.18,-.72);s.lineTo(1.12,-1.45);s.quadraticCurveTo(1.18,-1.9,1.02,-2.18);s.quadraticCurveTo(0,-2.36,-1.02,-2.18);return s}const base=new THREE.Mesh(new THREE.ExtrudeGeometry(curvedBodyShape(),{depth:.55,bevelEnabled:true,bevelSegments:3,steps:1,bevelSize:.12,bevelThickness:.12}),paint);base.rotation.x=-Math.PI/2;base.position.y=.65;car.add(base);const hood=new THREE.Mesh(new THREE.BoxGeometry(1.85,.18,1.35),paint);hood.position.set(0,1.03,1.35);hood.scale.set(1,.65,1);car.add(hood);const rearDeck=new THREE.Mesh(new THREE.BoxGeometry(1.75,.2,.8),paint);rearDeck.position.set(0,1.02,-1.65);car.add(rearDeck);const roofShape=new THREE.Shape();roofShape.moveTo(-.72,-.8);roofShape.quadraticCurveTo(-.85,-.4,-.62,.5);roofShape.quadraticCurveTo(-.45,1.0,0,1.05);roofShape.quadraticCurveTo(.45,1.0,.62,.5);roofShape.quadraticCurveTo(.85,-.4,.72,-.8);roofShape.quadraticCurveTo(0,-1.05,-.72,-.8);const cabin=new THREE.Mesh(new THREE.ExtrudeGeometry(roofShape,{depth:.62,bevelEnabled:true,bevelSegments:4,steps:1,bevelSize:.08,bevelThickness:.08}),glassmat);cabin.rotation.x=-Math.PI/2;cabin.position.set(0,1.28,-.05);cabin.scale.set(.9,.85,1);car.add(cabin);for(let x of [-1.02,1.02])for(let z of [-1.45,1.42]){const arch=new THREE.Mesh(new THREE.TorusGeometry(.54,.16,10,24,Math.PI),paint);arch.rotation.z=Math.PI;arch.rotation.y=Math.PI/2;arch.position.set(x,.55,z);car.add(arch);const wg=new THREE.Group();wg.position.set(x,.48,z);const tire=new THREE.Mesh(new THREE.CylinderGeometry(.45,.45,.32,24),rubber);tire.rotation.z=Math.PI/2;wg.add(tire);const rim=new THREE.Mesh(new THREE.CylinderGeometry(.31,.31,.34,24),chrome);rim.rotation.z=Math.PI/2;wg.add(rim);const center=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,.36,12),mat(0x262a2d,.25));center.rotation.z=Math.PI/2;wg.add(center);car.add(wg)}const splitter=new THREE.Mesh(new THREE.BoxGeometry(2,.12,.35),dark);splitter.position.set(0,.35,2.12);car.add(splitter);const spoiler=new THREE.Mesh(new THREE.BoxGeometry(1.8,.08,.38),dark);spoiler.position.set(0,1.1,-2.15);car.add(spoiler);for(let x of [-.68,.68]){const lamp=new THREE.Mesh(new THREE.BoxGeometry(.45,.12,.25),new THREE.MeshStandardMaterial({color:0xffe8b0,emissive:0xffbb50,emissiveIntensity:.35}));lamp.position.set(x,.86,2.05);car.add(lamp);const tail=new THREE.Mesh(new THREE.BoxGeometry(.55,.12,.14),mat(0xff2020,.3));tail.position.set(x,.9,-2.2);car.add(tail)}
car.position.set(0,0,8);car.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(car);
let speed=0,steer=0,gas=0,brake=0,prev=performance.now(),frames=0,fpsTime=prev;const steerEl=document.getElementById('steer');let steering=false;steerEl.addEventListener('pointerdown',e=>{e.preventDefault();steering=true;steerEl.setPointerCapture(e.pointerId);steer=e.offsetX/steerEl.clientWidth*2-1});steerEl.addEventListener('pointermove',e=>{if(steering)steer=e.offsetX/steerEl.clientWidth*2-1});steerEl.addEventListener('pointerup',()=>{steering=false;steer=0});steerEl.addEventListener('pointercancel',()=>{steering=false;steer=0});function bind(el,key){el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);if(key==='gas')gas=1;else brake=1});const off=()=>{if(key==='gas')gas=0;else brake=0};el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off)}bind(document.getElementById('gas'),'gas');bind(document.getElementById('brake'),'brake');
function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-prev)/1000,.05);prev=now;speed=Math.max(0,Math.min(85,speed+gas*28*dt-brake*45*dt-(gas?0:8*dt)));car.position.z-=speed*dt*.16;car.rotation.y-=steer*speed*.00065;car.position.x+=Math.sin(car.rotation.y)*speed*dt*.12;car.position.x=Math.max(-6,Math.min(6,car.position.x));camera.position.lerp(new THREE.Vector3(car.position.x,5.2,car.position.z+9),.08);camera.lookAt(car.position.x,1,car.position.z-4);document.getElementById('speed').textContent=Math.round(speed);frames++;if(now-fpsTime>1000){document.getElementById('fps').textContent='FPS: '+frames;frames=0;fpsTime=now}renderer.render(scene,camera)}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(err){let box=document.getElementById('error');box.style.display='block';box.textContent='3D 初始化失敗：'+(err?.message||err);document.getElementById('fps').textContent='FPS: 初始化失敗';console.error(err)}
</script></body></html>
