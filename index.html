<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>City Drive Prototype</title><style>
*{box-sizing:border-box;-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ec9df;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}body, .controls, .hint, .pedal, .steer{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}body{overscroll-behavior:none}.hud{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;color:#fff;text-shadow:0 2px 5px #000;background:#1118;padding:10px 13px;border-radius:12px;font-weight:700;z-index:3}.controls{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));width:100%;display:flex;justify-content:space-between;align-items:flex-end;padding:0 22px;z-index:4}.steer{width:min(34vw,150px);height:min(34vw,150px);border-radius:50%;background:#ffffff33;border:2px solid #fff8;display:flex;align-items:center;justify-content:center;color:white;font-size:34px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.right{display:flex;gap:14px}.pedal{width:min(19vw,95px);height:min(27vw,120px);border-radius:18px;background:#ffffff33;border:2px solid #fff8;color:white;font-weight:bold;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.hint{position:fixed;bottom:calc(165px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);color:#fff;text-shadow:0 2px 4px #000;white-space:nowrap;z-index:2}.error{position:fixed;left:12px;right:12px;top:100px;background:#7b1d1d;color:white;padding:12px;border-radius:12px;z-index:10;display:none;font-size:14px}
</style></head><body><div class="hud">CITY DRIVE <span id="speed">0</span> km/h<br><small id="fps">FPS: 啟動中…</small></div><div class="error" id="error"></div><div class="hint">拖曳方向盤 · 按住油門行駛</div><div class="controls"><div class="steer" id="steer">↔</div><div class="right"><div class="pedal" id="brake">煞車</div><div class="pedal" id="gas">油門</div></div></div>
<script type="module">
let THREE;
try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js')}catch(e){try{THREE=await import('https://unpkg.com/three@0.160.0/build/three.module.js')}catch(e2){document.getElementById('fps').textContent='FPS: 載入失敗';let box=document.getElementById('error');box.style.display='block';box.textContent='3D 引擎載入失敗。請確認網路連線，重新整理頁面。';throw e2}}
try{
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ec9df);scene.fog=new THREE.Fog(0x9ec9df,70,240);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.domElement.style.position='fixed';renderer.domElement.style.inset='0';renderer.domElement.style.zIndex='1';document.body.appendChild(renderer.domElement);renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('selectstart',e=>e.preventDefault(),{passive:false});document.addEventListener('contextmenu',e=>e.preventDefault(),{passive:false});document.addEventListener('touchstart',e=>{if(e.target.closest('.controls,.hud,.hint'))e.preventDefault()},{passive:false});document.addEventListener('touchend',e=>{if(e.target.closest('.controls,.hud,.hint'))e.preventDefault()},{passive:false});
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;scene.add(new THREE.HemisphereLight(0xeaf6ff,0x536247,2.3));const sun=new THREE.DirectionalLight(0xfff0d8,2.2);sun.position.set(-35,65,45);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=55;sun.shadow.camera.bottom=-55;sun.shadow.bias=-.0005;scene.add(sun);const mat=(c,r=.8)=>new THREE.MeshStandardMaterial({color:c,roughness:r});const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),mat(0x668c62));ground.rotation.x=-Math.PI/2;ground.position.y=-.1;ground.receiveShadow=true;scene.add(ground);const shoulder=new THREE.Mesh(new THREE.PlaneGeometry(24,300),mat(0x50575a));shoulder.rotation.x=-Math.PI/2;shoulder.position.y=0;scene.add(shoulder);const road=new THREE.Mesh(new THREE.PlaneGeometry(18,300),mat(0x292d32,.96));road.rotation.x=-Math.PI/2;road.position.y=.025;road.receiveShadow=true;scene.add(road);for(let x of [-8.3,8.3]){let edge=new THREE.Mesh(new THREE.BoxGeometry(.18,.035,300),mat(0xf2f2e9));edge.position.set(x,.06,0);scene.add(edge)}for(let z=-140;z<150;z+=10){let d=new THREE.Mesh(new THREE.BoxGeometry(.16,.035,4.3),mat(0xf5f2df));d.position.set(0,.06,z);scene.add(d)}for(let x of [-9.5,9.5]){let curb=new THREE.Mesh(new THREE.BoxGeometry(.55,.35,300),mat(0xb9b9b3));curb.position.set(x,.16,0);curb.castShadow=true;scene.add(curb);let sidewalk=new THREE.Mesh(new THREE.BoxGeometry(3,.12,300),mat(0x999b97));sidewalk.position.set(x*1.25,.22,0);scene.add(sidewalk)}for(let z=-135;z<140;z+=24){for(let side of [-1,1]){let pole=new THREE.Mesh(new CylinderGeometry(.09,.13,6,8),mat(0x353a40));pole.position.set(side*12,3,z);scene.add(pole);let arm=new THREE.Mesh(new BoxGeometry(1.4,.12,.12),mat(0x353a40));arm.position.set(side*11.4,5.7,z);scene.add(arm);let lamp=new THREE.Mesh(new BoxGeometry(.5,.18,.35),mat(0xffe4a2,.4));lamp.position.set(side*10.8,5.65,z);scene.add(lamp)}}
for(let i=0;i<65;i++){let side=i%2?1:-1,z=-140+i*4.5,x=side*(14+Math.random()*18),h=8+Math.random()*35,w=7+Math.random()*10;let b=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),mat([0x8899aa,0xc4b8a8,0x7e9992,0x9c8d9d][i%4]));b.position.set(x,h/2,z);b.castShadow=true;b.receiveShadow=true;scene.add(b);for(let yy=3;yy<h-2;yy+=3.5)for(let xx=-w/2+1;xx<w/2-1;xx+=2.5){let win=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.4,.08),mat(0xadd5e8));win.position.set(x+xx,yy,z+side*(w/2+.05));scene.add(win)}}for(let i=0;i<45;i++){let z=-130+i*7.5,side=i%2?1:-1,x=side*(17+Math.random()*5);let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22,.38,3.4,8),mat(0x76503a));trunk.position.set(x,1.7,z);trunk.castShadow=true;scene.add(trunk);let crown=new THREE.Mesh(new THREE.SphereGeometry(2.5,12,10),mat([0x39794a,0x477f49,0x53864b][i%3]));crown.position.set(x,4.2,z);crown.castShadow=true;scene.add(crown)}
const car=new THREE.Group();const paint=mat(0xe5b82e,.38);const body=new THREE.Mesh(new THREE.BoxGeometry(2.12,.78,4.35),paint);body.position.y=.82;body.castShadow=true;car.add(body);const hood=new THREE.Mesh(new THREE.BoxGeometry(1.98,.22,1.15),paint);hood.position.set(0,1.18,1.3);car.add(hood);const cab=new THREE.Mesh(new THREE.BoxGeometry(1.58,.78,1.92),paint);cab.position.set(0,1.48,-.15);cab.castShadow=true;car.add(cab);const glassmat=new THREE.MeshStandardMaterial({color:0x244353,roughness:.18,metalness:.25});const glass=new THREE.Mesh(new THREE.BoxGeometry(1.43,.53,1.7),glassmat);glass.position.set(0,1.58,-.15);car.add(glass);for(let x of [-1.05,1.05])for(let z of [-1.4,1.4]){let wheel=new THREE.Mesh(new THREE.CylinderGeometry(.43,.43,.3,20),mat(0x202124,.95));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.43,z);car.add(wheel);let hub=new THREE.Mesh(new THREE.CylinderGeometry(.19,.19,.32,12),mat(0xb7b9bd,.35));hub.rotation.z=Math.PI/2;hub.position.set(x,.43,z);car.add(hub)}for(let x of [-.72,.72]){let head=new THREE.Mesh(new BoxGeometry(.35,.15,.12),mat(0xfff4d1,.3));head.position.set(x,.86,2.18);car.add(head);let tail=new THREE.Mesh(new BoxGeometry(.3,.2,.12),mat(0xe43b35,.4));tail.position.set(x,.85,-2.18);car.add(tail)}car.position.set(0,0,8);car.traverse(o=>{if(o.isMesh)o.castShadow=true});scene.add(car);
let speed=0,steer=0,gas=0,brake=0,prev=performance.now(),frames=0,fpsTime=prev;const steerEl=document.getElementById('steer');let steering=false;steerEl.addEventListener('pointerdown',e=>{e.preventDefault();steering=true;steerEl.setPointerCapture(e.pointerId);steer=e.offsetX/steerEl.clientWidth*2-1});steerEl.addEventListener('pointermove',e=>{if(steering)steer=e.offsetX/steerEl.clientWidth*2-1});steerEl.addEventListener('pointerup',()=>{steering=false;steer=0});steerEl.addEventListener('pointercancel',()=>{steering=false;steer=0});function bind(el,key){el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);if(key==='gas')gas=1;else brake=1});const off=()=>{if(key==='gas')gas=0;else brake=0};el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off)}bind(document.getElementById('gas'),'gas');bind(document.getElementById('brake'),'brake');
function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-prev)/1000,.05);prev=now;speed=Math.max(0,Math.min(85,speed+gas*28*dt-brake*45*dt-(gas?0:8*dt)));car.position.z-=speed*dt*.16;car.rotation.y-=steer*speed*.00065;car.position.x+=Math.sin(car.rotation.y)*speed*dt*.12;car.position.x=Math.max(-6,Math.min(6,car.position.x));camera.position.lerp(new THREE.Vector3(car.position.x,5.2,car.position.z+9),.08);camera.lookAt(car.position.x,1,car.position.z-4);document.getElementById('speed').textContent=Math.round(speed);frames++;if(now-fpsTime>1000){document.getElementById('fps').textContent='FPS: '+frames;frames=0;fpsTime=now}renderer.render(scene,camera)}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(err){let box=document.getElementById('error');box.style.display='block';box.textContent='3D 初始化失敗：'+(err?.message||err);document.getElementById('fps').textContent='FPS: 初始化失敗';console.error(err)}
</script></body></html>
