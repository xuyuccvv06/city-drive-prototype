<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>玄翼 · City Drive</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#181b20;color:#e7e9ed;font:14px system-ui,sans-serif}
#garage{position:fixed;inset:0;overscroll-behavior:none;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#status{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;letter-spacing:.08em}
#status[hidden]{display:none}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<main id="garage" aria-label="玄翼三維車庫，可拖曳環繞、捏合縮放"></main>
<div id="status" role="status">正在載入玄翼…</div>
<script type="module">
try {
  const [THREE,{OrbitControls},{GLTFLoader},{MeshoptDecoder}] = await Promise.all([
    import('three'),import('three/addons/controls/OrbitControls.js'),import('three/addons/loaders/GLTFLoader.js'),import('three/addons/libs/meshopt_decoder.module.js')
  ]);
  const garage = document.querySelector('#garage');
  const status = document.querySelector('#status');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x20242b);
  const camera = new THREE.PerspectiveCamera(40,1,.055,80);
  const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.23;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  garage.append(renderer.domElement);

  const controls = new OrbitControls(camera,renderer.domElement);
  controls.target.set(0,.55,0);
  controls.enableDamping = true;
  controls.dampingFactor = .085;
  controls.minPolarAngle = .12;
  controls.maxPolarAngle = Math.PI*.493;
  controls.minDistance = 1.38;
  controls.maxDistance = 9;
  controls.zoomSpeed = .85;
  controls.enablePan = false;
  controls.touches.ONE = THREE.TOUCH.ROTATE;
  controls.touches.TWO = THREE.TOUCH.DOLLY_PAN;

  function fitView(initial = false) {
    const {clientWidth:width,clientHeight:height} = garage;
    camera.aspect = width / Math.max(height,1);
    if (initial) {
      camera.position.set(3.7,2.05,4.6);
      if (camera.aspect < .75) camera.position.set(1.85,2.75,8.35);
    }
    camera.fov = camera.aspect < .7 ? 60 : 39;
    camera.updateProjectionMatrix();
    renderer.setSize(width,height);
    controls.update();
  }
  fitView(true);
  new ResizeObserver(() => fitView()).observe(garage);

  function makeFloorTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = 512;
    const ctx = canvas.getContext('2d');
    const pixels = ctx.createImageData(512,512);
    let seed = 34823;
    for (let y=0;y<512;y++) {
      for (let x=0;x<512;x++) {
        seed = (Math.imul(seed,1664525)+1013904223)>>>0;
        const fleck = (seed >>> 27)-16;
        const shade = 98 + fleck + Math.sin(x*.066+y*.031)*4 + Math.cos(y*.077-x*.043)*3;
        const i = (y*512+x)*4;
        pixels.data.set([shade,shade+2,shade+5,255],i);
      }
    }
    ctx.putImageData(pixels,0,0);
    ctx.fillStyle = '#474b51';
    ctx.fillRect(0,0,512,2);
    ctx.fillRect(0,0,2,512);
    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(7,7);
    texture.anisotropy = Math.min(4,renderer.capabilities.getMaxAnisotropy());
    return texture;
  }
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(22,22),new THREE.MeshStandardMaterial({
    map:makeFloorTexture(),roughness:.62,metalness:.08
  }));
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  scene.add(floor);

  const wall = new THREE.MeshStandardMaterial({color:0x444950,roughness:.85});
  const baseboard = new THREE.MeshStandardMaterial({color:0x272b30,roughness:.8});
  const ceiling = new THREE.MeshStandardMaterial({color:0x343a44,roughness:.94,emissive:0x20252d,emissiveIntensity:.7});
  const fixtures = new THREE.MeshBasicMaterial({color:0xdcecff,toneMapped:false});
  function block(material,sizes,position,parent=scene) {
    const object = new THREE.Mesh(new THREE.BoxGeometry(...sizes),material);
    object.position.set(...position);
    parent.add(object);
    return object;
  }
  const roof = new THREE.Mesh(new THREE.PlaneGeometry(21,21),ceiling);
  roof.rotation.x = Math.PI/2;
  roof.position.y = 4.25;
  scene.add(roof);
  for (const side of [-1,1]) {
    block(wall,[.16,4.25,21],[side*10.4,2.1,0]);
    block(wall,[21,4.25,.16],[0,2.1,side*10.4]);
    block(baseboard,[.20,.26,21],[side*10.32,.13,0]);
    block(baseboard,[21,.26,.20],[0,.13,side*10.32]);
    for(const aligned of [-5.2,0,5.2]) {
      block(baseboard,[.22,4.1,.12],[aligned,2.18,side*10.30]);
      block(baseboard,[.12,4.1,.22],[side*10.30,2.18,aligned]);
    }
    block(fixtures,[.26,.045,7.6],[side*2.55,4.08,0]);
  }

  // A studio reflection rig is rendered once into prefiltered lighting.
  const reflect = new THREE.Scene();
  reflect.background = new THREE.Color(.115,.133,.165);
  const whitePanel = new THREE.MeshBasicMaterial({color:new THREE.Color(3.6,3.75,4.05)});
  const warmPanel = new THREE.MeshBasicMaterial({color:new THREE.Color(2.15,1.91,1.66)});
  block(whitePanel,[.74,.035,7.4],[-2.2,3.5,0],reflect);
  block(whitePanel,[.96,.035,7.4],[2.0,3.8,0],reflect);
  block(warmPanel,[3,1.5,.035],[0,1.9,-5.1],reflect);
  block(whitePanel,[2.45,1.2,.035],[0,2.2,5.1],reflect);
  const pmrem = new THREE.PMREMGenerator(renderer);
  const environment = pmrem.fromScene(reflect,.055,.1,30);
  scene.environment = environment.texture;
  pmrem.dispose();

  scene.add(new THREE.HemisphereLight(0xc9d9f4,0x63606a,1.25));
  const key = new THREE.DirectionalLight(0xffeed9,2.55);
  key.position.set(-3.7,7,4.5);
  key.castShadow = true;
  key.shadow.mapSize.set(2048,2048);
  Object.assign(key.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:.2,far:15});
  key.shadow.normalBias = .018;
  key.shadow.bias = -.00015;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xc5dbff,1.55);
  fill.position.set(4,3,-5);
  scene.add(fill);

  const shadowCanvas = document.createElement('canvas');
  shadowCanvas.width=128;
  shadowCanvas.height=256;
  const ctx = shadowCanvas.getContext('2d');
  ctx.translate(64,128);
  ctx.scale(62,125);
  const darkness = ctx.createRadialGradient(0,0,0,0,0,1);
  darkness.addColorStop(0,'rgba(0,0,0,.70)');
  darkness.addColorStop(.56,'rgba(0,0,0,.54)');
  darkness.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=darkness;
  ctx.fillRect(-1,-1,2,2);
  const contact = new THREE.Mesh(new THREE.PlaneGeometry(3.2,5.6),new THREE.MeshBasicMaterial({
    map:new THREE.CanvasTexture(shadowCanvas),transparent:true,depthWrite:false
  }));
  contact.rotation.x=-Math.PI/2;
  contact.position.y=.006;
  scene.add(contact);

  const model = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync('./assets/onyx.glb?v=1');
  const bounds = new THREE.Box3().setFromObject(model.scene);
  if (bounds.isEmpty()) throw new Error('GLB has no visible geometry');
  const center = bounds.getCenter(new THREE.Vector3());
  model.scene.position.set(-center.x,-bounds.min.y,-center.z);
  model.scene.traverse(object => {
    if (object.isMesh) {
      object.castShadow = true;
      object.receiveShadow = true;
    }
  });
  scene.add(model.scene);
  const displayBounds = new THREE.Box3().setFromObject(model.scene);
  const corner = new THREE.Vector3();
  // Frame the entire vehicle at launch, including the nearest wing tip.
  for (let pass=0;pass<12;pass++) {
    camera.updateMatrixWorld();
    let extendsBeyondFrame = false;
    for (const x of [displayBounds.min.x,displayBounds.max.x]) {
      for (const y of [displayBounds.min.y,displayBounds.max.y]) {
        for (const z of [displayBounds.min.z,displayBounds.max.z]) {
          corner.set(x,y,z).project(camera);
          extendsBeyondFrame ||= Math.abs(corner.x) > .92 || Math.abs(corner.y) > .90;
        }
      }
    }
    if (!extendsBeyondFrame) break;
    camera.fov += 1.5;
    camera.updateProjectionMatrix();
  }
  renderer.shadowMap.needsUpdate=true;
  status.hidden=true;
  const cameraDirection = new THREE.Vector3();
  const halfSize = bounds.getSize(new THREE.Vector3()).multiplyScalar(.5);
  let needsRender = true;
  controls.addEventListener('change',() => { needsRender=true; });
  new ResizeObserver(() => { needsRender=true; }).observe(garage);
  renderer.setAnimationLoop(() => {
    controls.update();
    cameraDirection.subVectors(camera.position,controls.target).normalize();
    const vertical = cameraDirection.y > 0 ? halfSize.y*2-controls.target.y : controls.target.y;
    controls.minDistance = Math.max(1.33,.34 + Math.min(
      halfSize.x / Math.abs(cameraDirection.x),
      vertical / Math.abs(cameraDirection.y),
      halfSize.z / Math.abs(cameraDirection.z)
    ));
    if (controls.getDistance() < controls.minDistance) controls.update();
    if (needsRender) {
      renderer.render(scene,camera);
      needsRender = false;
    }
  });
} catch (error) {
  document.querySelector('#status').textContent='車輛載入失敗，請重新整理頁面。';
  console.error(error);
}
</script>
</body>
</html>
