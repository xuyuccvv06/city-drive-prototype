function surface(rows, material) {
  const points = rows.flat(1);
  const width = rows[0].length;
  const indices = [];
  for (let row = 0; row < rows.length - 1; row++) {
    for (let column = 0; column < width - 1; column++) {
      const a = row * width + column;
      const b = a + 1;
      const c = a + width;
      indices.push(a,c,b,b,c,c + 1);
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(points.flat(),3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return addMesh(geometry, material);
}

  return surface(Array.from({length:steps + 1}, (_,row) =>
    columns.map(column => column[row].toArray())

  surface([
    [...outline,outline[0]].map(([x,y]) => [x,y,z]),
    [...recessed,recessed[0]].map(([x,y]) => [x,y,depth])
  ],surround);
  const panel = rearPanel(recessed.map(([x,y]) => [direction*x,y]),meshGrille,depth);

  box(.23,.054,.06,carbon,side*.86,1.245,.46);
  const intakeRows = [
    [[side*1.115,.65,-.69],[side*1.148,.87,-.69]],
    [[side*1.084,.72,-.48],[side*1.102,.87,-.48]],
    [[side*1.033,.83,-.25],[side*1.041,.865,-.25]]
  ];
  surface(side < 0 ? intakeRows : intakeRows.map(row => [...row].reverse()),grille);
  trim([[side*.62,.758,2.155],[side*.79,.786,2.012],[side*.935,.837,1.765]],.034,carbon);
  trim([[side*.62,.777,2.155],[side*.79,.807,2.012],[side*.935,.858,1.765]],.017,headLight);
  const lampPath = [[side*.48,.885,-2.467],[side*.68,.88,-2.477],
    [side*.89,.917,-2.464],[side*1.036,.958,-2.421]];
  trim(lampPath,.046,carbon);
  trim(lampPath.map(([x,y,z]) => [x,y,z-.029]),.021,tailLight);
  for (let segment = 0; segment < 4; segment++) {
    const x = .64 + segment*.084;
    const led = box(.049,.017,.025,tailLight,side*x,.853+segment*.014,-2.486+segment*.005);
    led.rotation.z = side*.30;
  }
  for (const offset of [.22,.51,.83]) {
    const fin = box(.038,.18,.43,carbon,side*offset,.32,-2.24);
    fin.rotation.x = -.14;
  }
  const exhaust = addMesh(new THREE.CylinderGeometry(.092,.092,.22,16,1,true),metal,side*.69,.47,-2.40);
  exhaust.rotation.x = Math.PI/2;
  const opening = addMesh(new THREE.CircleGeometry(.091,16),grille,side*.69,.47,-2.435);
  opening.rotation.y = Math.PI;
  const lip = addMesh(new THREE.TorusGeometry(.087,.021,8,18),metal,side*.69,.47,-2.513);
  lip.rotation.y = Math.PI;
  for (const z of [-1.50,1.42]) {
    const wheel = new THREE.Group();
    wheel.position.set(side*(z < 0 ? 1.165 : 1.045),.405,z);
    car.add(wheel);
    wheels.push(wheel);
    addMesh(tireGeometry,rubber,0,0,0,wheel).rotation.z = Math.PI/2;
    addMesh(sidewallGeometry,rubber,side*.104,0,0,wheel).rotation.y = Math.PI/2;
    const tread = new THREE.InstancedMesh(treadGeometry,carbon,28);
    for (let index = 0; index < tread.count; index++) {
      const angle = index*Math.PI*2/tread.count;
      treadMatrix.makeRotationX(angle).setPosition(0,.393*Math.cos(angle),.393*Math.sin(angle));
      tread.setMatrixAt(index,treadMatrix);
    }
    tread.instanceMatrix.needsUpdate = true;
    wheel.add(tread);
    addMesh(rimGeometry,carbon,0,0,0,wheel).rotation.z = Math.PI/2;
    addMesh(rimLipGeometry,metal,side*.16,0,0,wheel).rotation.y = Math.PI/2;
    addMesh(hubGeometry,metal,side*.17,0,0,wheel).scale.x = .32;
    const spokes = new THREE.InstancedMesh(spokeGeometry,metal,5);
    for (let index = 0; index < spokes.count; index++) {
      const angle = index * Math.PI * 2 / spokes.count;
      spokeMatrix.makeRotationX(angle).setPosition(side*.168,Math.cos(angle)*.153,Math.sin(angle)*.153);
      spokes.setMatrixAt(index,spokeMatrix);
    }
    spokes.instanceMatrix.needsUpdate = true;
    wheel.add(spokes);
  }
}

// The model's nose points toward +Z, while the roadway advances toward -Z.
const vehicle = new THREE.Group();
car.rotation.y = Math.PI;
vehicle.add(car);
vehicle.position.set(0, 0, 8);
// Ambient contact shading keeps the car grounded in diffuse daylight.
const shadowCanvas = document.createElement('canvas');
shadowCanvas.width = shadowCanvas.height = 192;
const shadowContext = shadowCanvas.getContext('2d');
const shadowSize = 6;
shadowContext.translate(shadowCanvas.width / 2,shadowCanvas.height / 2);
shadowContext.scale(shadowCanvas.width / shadowSize,shadowCanvas.height / shadowSize);

function drawContact(x,z,radiusX,radiusZ,opacity) {
  shadowContext.save();
  shadowContext.translate(x,z);
  shadowContext.scale(radiusX,radiusZ);
  const fade = shadowContext.createRadialGradient(0,0,0,0,0,1);
  fade.addColorStop(0,`rgba(0,0,0,${opacity})`);
  fade.addColorStop(.57,`rgba(0,0,0,${opacity*.55})`);
  fade.addColorStop(1,'rgba(0,0,0,0)');
  shadowContext.fillStyle = fade;
  shadowContext.fillRect(-1,-1,2,2);
  shadowContext.restore();
}

drawContact(0,.05,1.29,2.51,.40);
for (const wheel of wheels) {
  drawContact(-wheel.position.x,-wheel.position.z,.26,.37,.59);
}
const contactShadow = new THREE.Mesh(new THREE.PlaneGeometry(shadowSize,shadowSize),new THREE.MeshBasicMaterial({
  map:new THREE.CanvasTexture(shadowCanvas), transparent:true, depthWrite:false, toneMapped:false
}));
contactShadow.rotation.x = -Math.PI / 2;
contactShadow.position.y = .083;
vehicle.add(contactShadow);
scene.add(vehicle);

let speed = 0;
let steer = 0;
let previousFrame = performance.now();
let fpsTime = previousFrame;
let frames = 0;
const speedEl = document.getElementById('speed');
const fpsEl = document.getElementById('fps');
const hint = document.querySelector('.hint');
const keys = new Set();
const drivingKeys = new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyS','KeyA','KeyD']);
const steerEl = document.getElementById('steer');
let steeringPointer = null;
let gasPointer = null;
let brakePointer = null;

function updateSteering(event) {
  const bounds = steerEl.getBoundingClientRect();
  steer = THREE.MathUtils.clamp((event.clientX - bounds.left) / bounds.width * 2 - 1, -1, 1);
}

function bindHold(element, onPress, onMove, onRelease) {
  let activePointer = null;
  element.addEventListener('pointerdown', event => {
    if (activePointer !== null || event.button !== 0) return;
    event.preventDefault();
    element.setPointerCapture(event.pointerId);
    activePointer = event.pointerId;
    onPress(event);
  });
  if (onMove) {
    element.addEventListener('pointermove', event => {
      if (event.pointerId === activePointer) onMove(event);
    });
  }
  for (const eventName of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    element.addEventListener(eventName, event => {
      if (event.pointerId !== activePointer) return;
      activePointer = null;
      onRelease();
    });
  }
  addEventListener('blur', () => {
    const pointer = activePointer;
    activePointer = null;
    if (pointer !== null && element.hasPointerCapture(pointer)) element.releasePointerCapture(pointer);
    onRelease();
  });
}

bindHold(steerEl, event => {
  steeringPointer = event.pointerId;
  updateSteering(event);
}, updateSteering, () => { steeringPointer = null; steer = 0; });
bindHold(document.getElementById('gas'), event => { gasPointer = event.pointerId; }, null, () => { gasPointer = null; });
bindHold(document.getElementById('brake'), event => { brakePointer = event.pointerId; }, null, () => { brakePointer = null; });

addEventListener('keydown', event => {
  if (!drivingKeys.has(event.code) || event.altKey || event.ctrlKey || event.metaKey) return;
  event.preventDefault();
  keys.add(event.code);
});
addEventListener('keyup', event => keys.delete(event.code));
addEventListener('blur', () => keys.clear());

const cameraTarget = new THREE.Vector3();
const defaultHint = hint.textContent;
let hintUntil = 0;
function positionCamera(blend) {
  const {x,z} = vehicle.position;
  camera.position.lerp(cameraTarget.set(x, 5.2, z + 9), blend);
  camera.lookAt(x, 1, z - 4);
}
positionCamera(1);

function animate(now) {
  const dt = Math.min((now - previousFrame) / 1000, .1);
  previousFrame = now;
  const gas = gasPointer !== null || keys.has('ArrowUp') || keys.has('KeyW');
  const brake = brakePointer !== null || keys.has('ArrowDown') || keys.has('KeyS');
  const left = keys.has('ArrowLeft') || keys.has('KeyA');
  const right = keys.has('ArrowRight') || keys.has('KeyD');
  tailLight.emissiveIntensity = brake ? 2.8 : .7;
  const direction = steeringPointer !== null ? steer : Number(right) - Number(left);
  speed = THREE.MathUtils.clamp(speed + (gas * 28 - brake * 45 - (gas ? 0 : 8)) * dt, 0, 85);
  vehicle.position.z -= speed * dt * .16;
  for (const wheel of wheels) wheel.rotation.x += (speed * dt * .16) / .405;
  vehicle.position.x = THREE.MathUtils.clamp(vehicle.position.x + direction * speed * dt * .08, -6, 6);
  vehicle.rotation.y = THREE.MathUtils.lerp(vehicle.rotation.y, -direction * speed * .008, 1 - Math.exp(-8 * dt));
  if (vehicle.position.z < -125) {
    vehicle.position.set(0, 0, 8);
    vehicle.rotation.y = 0;
    speed = 0;
    hint.textContent = '已到路段終點，返回起點';
    hintUntil = now + 3000;
    positionCamera(1);
  } else {
    positionCamera(1 - Math.exp(-5 * dt));
  }
  if (hintUntil && now >= hintUntil) {
    hint.textContent = defaultHint;
    hintUntil = 0;
  }
  const displaySpeed = String(Math.round(speed));
  if (speedEl.textContent !== displaySpeed) speedEl.textContent = displaySpeed;
  frames++;
  if (now - fpsTime >= 1000) {
    fpsEl.textContent = 'FPS: ' + Math.round(frames * 1000 / (now - fpsTime));
    frames = 0;
    fpsTime = now;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
}catch(err){let box=document.getElementById('error');box.style.display='block';box.textContent='3D 初始化失敗：'+(err?.message||err);document.getElementById('fps').textContent='FPS: 初始化失敗';console.error(err)}
</script></body></html>
