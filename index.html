<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>City Drive Prototype</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#9ec9df;font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none}canvas{display:block}.hud{position:fixed;top:12px;left:12px;color:#fff;text-shadow:0 2px 5px #000;background:#1118;padding:10px 13px;border-radius:12px;font-weight:700;z-index:3}.controls{position:fixed;bottom:22px;width:100%;display:flex;justify-content:space-between;align-items:flex-end;padding:0 22px;z-index:4}.steer{width:130px;height:130px;border-radius:50%;background:#ffffff33;border:2px solid #fff8;display:flex;align-items:center;justify-content:center;color:white;font-size:34px;touch-action:none}.right{display:flex;gap:14px}.pedal{width:78px;height:110px;border-radius:18px;background:#ffffff33;border:2px solid #fff8;color:white;font-weight:bold;display:flex;align-items:center;justify-content:center;touch-action:none}.hint{position:fixed;bottom:155px;left:50%;transform:translateX(-50%);color:#fff;text-shadow:0 2px 4px #000;white-space:nowrap;z-index:2}
</style></head><body><div class="hud">CITY DRIVE <span id="speed">0</span> km/h<br><small id="fps">FPS: --</small></div><div class="hint">拖曳方向盤 · 按住油門行駛</div><div class="controls"><div class="steer" id="steer">↔</div><div class="right"><div class="pedal" id="brake">煞車</div><div class="pedal" id="gas">油門</div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ec9df);scene.fog=new THREE.Fog(0x9ec9df,70,240);const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x607080,2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-40,70,30);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8});const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),mat(0x668c62));ground.rotation.x=-Math.PI/2;ground.position.y=-.1;ground.receiveShadow=true;scene.add(ground);const road=new THREE.Mesh(new THREE.PlaneGeometry(18,300),mat(0x33383d));road.rotation.x=-Math.PI/2;road.position.y=.01;scene.add(road);for(let z=-140;z<150;z+=12){let d=new THREE.Mesh(new THREE.BoxGeometry(.25,.04,5),mat(0xffffff));d.position.set(0,.05,z);scene.add(d)}for(let x of [-9,9]){let curb=new THREE.Mesh(new THREE.BoxGeometry(.5,.3,300),mat(0xb7b7b7));curb.position.set(x,.12,0);scene.add(curb)}
for(let i=0;i<65;i++){let side=i%2?1:-1,z=-140+i*4.5,x=side*(14+Math.random()*18),h=8+Math.random()*35,w=7+Math.random()*10;let b=new THREE.Mesh(new THREE.BoxGeometry(w,h,w),mat([0x8899aa,0xc4b8a8,0x7e9992,0x9c8d9d][i%4]));b.position.set(x,h/2,z);b.castShadow=true;scene.add(b);for(let yy=3;yy<h-2;yy+=3.5)for(let xx=-w/2+1;xx<w/2-1;xx+=2.5){let win=new THREE.Mesh(new BoxGeometry(1.2,1.4,.08),mat(0xadd5e8));win.position.set(x+xx,yy,z+side*(w/2+.05));scene.add(win)}}for(let i=0;i<45;i++){let z=-130+i*7.5,side=i%2?1:-1,x=side*11;let trunk=new THREE.Mesh(new CylinderGeometry(.3,.45,3,8),mat(0x6d4934));trunk.position.set(x,1.5,z);scene.add(trunk);let crown=new THREE.Mesh(new SphereGeometry(2.1,10,8),mat(0x39794a));crown.position.set(x,4,z);scene.add(crown)}
const car=new THREE.Group();const body=new THREE.Mesh(new BoxGeometry(2.1,.8,4.2),mat(0xe9c531));body.position.y=.8;body.castShadow=true;car.add(body);const cab=new THREE.Mesh(new BoxGeometry(1.55,.75,1.8),mat(0xf2d34b));cab.position.set(0,1.45,-.15);car.add(cab);const glass=new THREE.Mesh(new BoxGeometry(1.42,.5,1.65),mat(0x344e5c));glass.position.set(0,1.55,-.15);car.add(glass);for(let x of [-1.05,1.05])for(let z of [-1.35,1.35]){let wheel=new THREE.Mesh(new CylinderGeometry(.42,.42,.28,16),mat(0x222222));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.42,z);car.add(wheel)}car.position.set(0,0,8);scene.add(car);
let speed=0,steer=0,gas=0,brake=0,prev=performance.now(),frames=0,fpsTime=prev;const steerEl=document.getElementById('steer');let steering=false;steerEl.addEventListener('pointerdown',e=>{steering=true;steerEl.setPointerCapture(e.pointerId);steer=e.offsetX/steerEl.clientWidth*2-1});steerEl.addEventListener('pointermove',e=>{if(steering)steer=e.offsetX/steerEl.clientWidth*2-1});steerEl.addEventListener('pointerup',()=>{steering=false;steer=0});steerEl.addEventListener('pointercancel',()=>{steering=false;steer=0});function bind(el,key){el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);window[key]=1});el.addEventListener('pointerup',()=>window[key]=0);el.addEventListener('pointercancel',()=>window[key]=0)}bind(document.getElementById('gas'),'gas');bind(document.getElementById('brake'),'brake');
function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-prev)/1000,.05);prev=now;speed=Math.max(0,Math.min(85,speed+gas*28*dt-brake*45*dt-(gas?0:8*dt)));car.position.z-=speed*dt*.16;car.rotation.y-=steer*speed*.00065;car.position.x+=Math.sin(car.rotation.y)*speed*dt*.12;car.position.x=Math.max(-6,Math.min(6,car.position.x));camera.position.lerp(new THREE.Vector3(car.position.x,5.2,car.position.z+9),.08);camera.lookAt(car.position.x,1,car.position.z-4);document.getElementById('speed').textContent=Math.round(speed);frames++;if(now-fpsTime>1000){document.getElementById('fps').textContent='FPS: '+frames;frames=0;fpsTime=now}renderer.render(scene,camera)}requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
