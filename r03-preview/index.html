<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>3D 車庫</title><style>body{margin:0;background:#20242b;color:white;font:14px system-ui}canvas{display:block;touch-action:none}header{position:fixed;z-index:2;top:12px;left:12px;right:12px}label{display:inline-block;background:#343d49;padding:12px;border-radius:8px}input{max-width:220px}footer{position:fixed;bottom:18px;width:100%;text-align:center;pointer-events:none}html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}canvas,header,footer,label{ -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input{touch-action:manipulation}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script><header>3D 車庫 · 獨立測試<br><label>選擇 GLB 模型 <input type="file" accept=".glb"></label><p id="status">請選擇 GLB 模型</p></header><footer>單指旋轉 · 雙指縮放</footer><script type="module">import * as T from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{RoomEnvironment}from'three/addons/environments/RoomEnvironment.js';const s=new T.Scene();s.background=new T.Color(0x20242b);const c=new T.PerspectiveCamera(45,innerWidth/innerHeight,.05,100);const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,1.75));r.setSize(innerWidth,innerHeight);r.toneMapping=T.ACESFilmicToneMapping;r.shadowMap.enabled=true;document.body.append(r.domElement);const isFileControl=e=>e.target instanceof Element&&!!e.target.closest("input,label");for(const type of ["contextmenu","selectstart","dragstart","dblclick"]){document.addEventListener(type,e=>{if(!isFileControl(e))e.preventDefault()},{capture:true});}document.addEventListener("touchmove",e=>{if(!isFileControl(e)&&e.cancelable)e.preventDefault()},{passive:false});const p=new T.PMREMGenerator(r);s.environment=p.fromScene(new RoomEnvironment(),.04).texture;p.dispose();const o=new OrbitControls(c,r.domElement);o.enableDamping=true;o.enablePan=false;o.maxPolarAngle=Math.PI*.49;o.target.set(0,.6,0);c.position.set(-5,2.4,-7);s.add(new T.HemisphereLight(0xffffff,0x666677,1.4));const l=new T.DirectionalLight(0xffeedb,2.2);l.position.set(-4,7,5);l.castShadow=true;l.shadow.mapSize.set(1024,1024);Object.assign(l.shadow.camera,{left:-5,right:5,top:5,bottom:-5});s.add(l);const f=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:0x555960,roughness:.8}));f.rotation.x=-Math.PI/2;f.receiveShadow=true;s.add(f);let model;const status=document.querySelector('#status');document.querySelector('input').onchange=async e=>{const file=e.target.files[0];if(!file)return;status.textContent='載入中…';try{const g=await new GLTFLoader().parseAsync(await file.arrayBuffer(),'');if(model)s.remove(model);model=g.scene;const b=new T.Box3().setFromObject(model),v=b.getCenter(new T.Vector3()),size=b.getSize(new T.Vector3());model.position.set(-v.x,-b.min.y,-v.z);model.traverse(x=>{if(x.isMesh){x.castShadow=true;x.receiveShadow=true}});s.add(model);o.target.set(0,size.y*.5,0);const d=Math.max(size.x,size.z)/Math.tan(T.MathUtils.degToRad(c.fov/2))/Math.min(1,c.aspect)*.65;c.position.set(-d*.65,d*.35,-d*.85);o.minDistance=Math.max(size.x,size.z)*.6;o.maxDistance=d*3;o.update();status.textContent='已載入 '+file.name}catch(err){status.textContent='載入失敗：'+err.message}};addEventListener('resize',()=>{c.aspect=innerWidth/innerHeight;c.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});r.setAnimationLoop(()=>{o.update();r.render(s,c)});</script></html>
